name: raaheHidayat
options:
    bundleIdPrefix: com.prayer.raahe
    deploymentTarget:
        iOS: 14.0
fileGroups: [../../src]
configs:
    debug: debug
    release: release
settingGroups:
    app:
        base:
            PRODUCT_NAME: raaheHidayat
            PRODUCT_BUNDLE_IDENTIFIER: com.prayer.raahe
            DEVELOPMENT_TEAM: R8953SWC87
targetTemplates:
    app:
        type: application
        sources:
            - path: Sources
        scheme:
            environmentVariables:
                RUST_BACKTRACE: full
                RUST_LOG: info
        settings:
            groups: [app]
targets:
    raaheHidayat_iOS:
        type: application
        platform: iOS
        sources:
            - path: Sources
            - path: Assets.xcassets
            - path: Externals
            - path: raaheHidayat_iOS
            - path: assets
              buildPhase: resources
              type: folder
            - path: LaunchScreen.storyboard
        info:
            path: raaheHidayat_iOS/Info.plist
            properties:
                LSRequiresIPhoneOS: true
                UILaunchStoryboardName: LaunchScreen
                UIRequiredDeviceCapabilities: [arm64, metal]
                UISupportedInterfaceOrientations:
                    - UIInterfaceOrientationPortrait
                    - UIInterfaceOrientationLandscapeLeft
                    - UIInterfaceOrientationLandscapeRight
                UISupportedInterfaceOrientations~ipad:
                    - UIInterfaceOrientationPortrait
                    - UIInterfaceOrientationPortraitUpsideDown
                    - UIInterfaceOrientationLandscapeLeft
                    - UIInterfaceOrientationLandscapeRight
                CFBundleShortVersionString: 3.0.0
                CFBundleVersion: "3.0.0"
        entitlements:
            path: raaheHidayat_iOS/raaheHidayat_iOS.entitlements
        scheme:
            environmentVariables:
                RUST_BACKTRACE: full
                RUST_LOG: info
        settings:
            base:
                ENABLE_BITCODE: false
                ARCHS: [arm64, x86_64]
                VALID_ARCHS: arm64  x86_64
                LIBRARY_SEARCH_PATHS[arch=x86_64]: $(inherited) $(PROJECT_DIR)/Externals/x86_64/$(CONFIGURATION) $(SDKROOT)/usr/lib/swift $(TOOLCHAIN_DIR)/usr/lib/swift/$(PLATFORM_NAME) $(TOOLCHAIN_DIR)/usr/lib/swift-5.0/$(PLATFORM_NAME)
                LIBRARY_SEARCH_PATHS[arch=arm64]: $(inherited) $(PROJECT_DIR)/Externals/arm64/$(CONFIGURATION) $(SDKROOT)/usr/lib/swift $(TOOLCHAIN_DIR)/usr/lib/swift/$(PLATFORM_NAME) $(TOOLCHAIN_DIR)/usr/lib/swift-5.0/$(PLATFORM_NAME)
                ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES: true
                EXCLUDED_ARCHS[sdk=iphoneos*]: x86_64
            # Push notifications need a per-configuration aps-environment: a
            # Release/TestFlight/App Store build signed with the debug
            # entitlements registers against the APNs *sandbox*, and its device
            # token is rejected by production APNs with no error the app can
            # see. Declared here (not just in the .pbxproj) so re-running
            # xcodegen / `tauri ios init` does not silently drop it.
            configs:
                debug:
                    CODE_SIGN_ENTITLEMENTS: raaheHidayat_iOS/raaheHidayat_iOS.entitlements
                    CODE_SIGN_IDENTITY: Apple Development
                release:
                    CODE_SIGN_ENTITLEMENTS: raaheHidayat_iOS/raaheHidayat_iOSrelease.entitlements
                    CODE_SIGN_IDENTITY: Apple Distribution
            groups: [app]
        dependencies:
            - framework: libapp.a
              embed: false
            - sdk: CoreGraphics.framework
            - sdk: Metal.framework
            - sdk: MetalKit.framework
            - sdk: QuartzCore.framework
            - sdk: Security.framework
            - sdk: UIKit.framework
            - sdk: WebKit.framework
        preBuildScripts:
            - script: npm run -- tauri ios xcode-script -v --platform ${PLATFORM_DISPLAY_NAME:?} --sdk-root ${SDKROOT:?} --framework-search-paths "${FRAMEWORK_SEARCH_PATHS:?}" --header-search-paths "${HEADER_SEARCH_PATHS:?}" --gcc-preprocessor-definitions "${GCC_PREPROCESSOR_DEFINITIONS:-}" --configuration ${CONFIGURATION:?} ${FORCE_COLOR} ${ARCHS:?}
              name: Build Rust Code
              basedOnDependencyAnalysis: false
              outputFiles:
                  - $(SRCROOT)/Externals/x86_64/${CONFIGURATION}/libapp.a
                  - $(SRCROOT)/Externals/arm64/${CONFIGURATION}/libapp.a
